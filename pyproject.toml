[project]
name = "ml-metadata-management-service"
version = "0.1.0"
description = "Minimal FastAPI backend for ML metadata management"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.40",
    "alembic==1.14.1",
    "pydantic==2.11.3",
    "psycopg[binary]==3.2.7",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "pandas==2.2.3",
    "pydantic-settings==2.7.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-length handled by formatter, keep code natural
    "B008",  # FastAPI uses Depends/File/Form/Query in argument defaults — idiomatic
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
