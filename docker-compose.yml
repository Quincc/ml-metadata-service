version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: metadata_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metadata_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/service/app",
        "--reload-include",
        "*.py",
        "--reload-include",
        "*.html",
        "--reload-include",
        "*.css",
        "--reload-include",
        "*.js"
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/metadata_db
    ports:
      - "8000:8000"
    volumes:
      - ./app:/service/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
