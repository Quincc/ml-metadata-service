services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: metadata_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metadata_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command:
      - sh
      - -c
      - |
        uv run python -c "from app.db import wait_for_database; wait_for_database()" && \
        uv run alembic upgrade head && \
        uv run uvicorn app.main:app \
          --host 0.0.0.0 --port 8000 \
          --reload --reload-dir /service/app \
          --reload-include '*.py' --reload-include '*.html' \
          --reload-include '*.css' --reload-include '*.js'
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/metadata_db
      DB_WAIT_MAX_ATTEMPTS: 30
      DB_WAIT_DELAY_SECONDS: 2
    ports:
      - "8000:8000"
    volumes:
      - ./app:/service/app
      - ./alembic:/service/alembic
      - ./alembic.ini:/service/alembic.ini
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
